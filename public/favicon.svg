<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D4FF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#05060A" />
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#cyber-grad)" stroke-width="3" stroke-dasharray="6 4" />
  <polygon points="50,24 74,68 26,68" fill="none" stroke="#00D4FF" stroke-width="3.5" filter="url(#glow)" />
  <circle cx="50" cy="50" r="6" fill="#8B5CF6" filter="url(#glow)" />
</svg>
